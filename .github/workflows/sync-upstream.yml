name: Auto Sync Fork

on:
  schedule:
    - cron: '0 18 * * *'  # 修正：UTC时间18点 = 北京时间凌晨2点
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}  # 添加token确保推送权限

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Check upstream remote
        run: |
          if git remote get-url upstream >/dev/null 2>&1; then
            echo "Upstream remote already exists"
            git remote set-url upstream https://github.com/HKUDS/nanobot.git
          else
            git remote add upstream https://github.com/HKUDS/nanobot.git
          fi

      - name: Fetch upstream
        run: git fetch upstream

      - name: Merge upstream changes
        run: |
          git checkout main
          # 检查是否有更新
          if git merge-base --is-ancestor upstream/main main; then
            echo "No new changes to merge"
            exit 0
          fi
          git merge upstream/main --no-edit --strategy-option theirs

      - name: Push changes
        run: git push origin main